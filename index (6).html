<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Five Ways In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: a bright classroom game board. Group desk = the Elvish sentence and answer sheet
   on the left, a column of five colour-coded support cards (one per theory) on the right. */
:root {
  --bg: #EEF2FA;
  --surface: #FFFFFF;
  --ink: #1C2140;
  --muted: #59618A;
  --line: #D3DAEA;
  --brand: #2C2F7C;
  --brand-soft: #E2E3F7;
  --wl: #178C57;  --wl-soft: #DDF3E8;
  --bl: #D8651A;  --bl-soft: #FCE8D7;
  --svr: #2A63D4; --svr-soft: #DEE8FB;
  --avr: #7F43CF; --avr-soft: #ECE2FA;
  --sl: #C7356F;  --sl-soft: #FADFEA;
  --good: #1F7A45; --good-soft: #DCF1E4;
  --warn: #9A5B0C; --warn-soft: #FBEBD1;
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12162D; --surface: #1C2142; --ink: #EEF0FA; --muted: #A5ABCF; --line: #323A66;
    --brand: #B9BCF6; --brand-soft: #2A2F5E;
    --wl: #5FD39A; --wl-soft: #173A2B; --bl: #F6A360; --bl-soft: #43291A;
    --svr: #7FA8F5; --svr-soft: #1B2D55; --avr: #BF98F2; --avr-soft: #30214E; --sl: #F17FAB; --sl-soft: #45192D;
    --good: #7CD6A0; --good-soft: #173826; --warn: #F2C16F; --warn-soft: #3F3016;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12162D; --surface: #1C2142; --ink: #EEF0FA; --muted: #A5ABCF; --line: #323A66;
  --brand: #B9BCF6; --brand-soft: #2A2F5E;
  --wl: #5FD39A; --wl-soft: #173A2B; --bl: #F6A360; --bl-soft: #43291A;
  --svr: #7FA8F5; --svr-soft: #1B2D55; --avr: #BF98F2; --avr-soft: #30214E; --sl: #F17FAB; --sl-soft: #45192D;
  --good: #7CD6A0; --good-soft: #173826; --warn: #F2C16F; --warn-soft: #3F3016;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1.02rem; line-height: 1.55; }
.wrap { max-width: 74rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 3rem; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 5.5vw, 3.3rem); color: var(--brand); }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
.eyebrow { font-family: var(--f-display); font-weight: 500; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }

button { font: inherit; cursor: pointer; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: .5rem 1rem; font-weight: 700; }
button:hover { border-color: var(--brand); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
button.primary { background: var(--brand); border-color: var(--brand); color: var(--surface); }
button.primary:disabled { opacity: .45; cursor: not-allowed; }
button.link { border: 0; background: none; padding: 0; color: var(--brand); text-decoration: underline; font-weight: 700; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 2px solid var(--line); }
.topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; padding-block: .6rem; }
.brand { display: flex; align-items: center; gap: .55rem; font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; color: var(--brand); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.nav { display: flex; gap: .35rem; flex-wrap: wrap; }
.nav button { padding: .3rem .85rem; font-size: .95rem; }
.nav button[aria-current="page"] { background: var(--brand); border-color: var(--brand); color: var(--surface); }

.intro { display: grid; gap: .8rem; padding-block: 2.2rem 1.6rem; max-width: 46rem; }
.intro p { font-size: 1.1rem; }
.rainbow { display: flex; height: 8px; border-radius: 99px; overflow: hidden; max-width: 14rem; }
.rainbow i { flex: 1; }

/* Group picker */
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: .9rem; }
.group-card { text-align: left; display: grid; gap: .5rem; padding: 1.1rem; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); }
.group-card:hover { border-color: var(--brand); transform: translateY(-2px); }
.group-name { font-family: var(--f-display); font-size: 1.45rem; font-weight: 600; color: var(--brand); }
.group-card .preview { display: flex; flex-wrap: wrap; row-gap: .15rem; color: var(--muted); }
.group-card .preview .elv { width: .95rem; height: 1.3rem; }
.group-card .preview .gap { width: .45rem; }

/* Desk */
.desk-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; padding-block: 1.6rem 1rem; }
.desk-head h2 { font-size: 2rem; color: var(--brand); }
.steps { display: flex; flex-wrap: wrap; gap: .35rem; list-style: none; padding: 0; margin: 0; }
.steps li { font-family: var(--f-display); font-size: .9rem; font-weight: 500; padding: .25rem .75rem; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
.steps li.on { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.steps li.done { border-color: var(--good); color: var(--good); }

.desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 22rem); gap: 1.25rem; align-items: start; }
@media (max-width: 54rem) { .desk { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 1.25rem; display: grid; gap: 1rem; min-width: 0; }
.col { display: grid; gap: 1.25rem; min-width: 0; }

/* Elvish sentence */
.sentence { display: flex; flex-wrap: wrap; gap: 1.1rem .9rem; align-items: flex-end; padding: .3rem 0; }
.word { display: flex; gap: .12rem; align-items: flex-end; border-radius: 10px; padding: .2rem; }
.sentence.tap .word { cursor: pointer; outline: 2px dashed var(--bl); outline-offset: 2px; }
.sentence.tap .word:hover { background: var(--bl-soft); }
.cell { display: grid; justify-items: center; gap: .05rem; }
.glyph { display: grid; place-items: center; width: 2.15rem; height: 2.8rem; color: var(--ink); }
.glyph .elv { width: 1.95rem; height: 2.6rem; }
.cell input {
  width: 2rem; height: 2.1rem; text-align: center; font-family: var(--f-display); font-size: 1.15rem; font-weight: 600;
  text-transform: lowercase; border: 0; border-bottom: 3px solid var(--line); border-radius: 0; background: transparent; color: var(--ink); padding: 0;
}
.cell input:focus { outline: none; border-bottom-color: var(--brand); background: var(--brand-soft); border-radius: 6px 6px 0 0; }
.cell.rev input { color: var(--bl); border-bottom-color: var(--bl); }
.cell.pop input { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.5); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
.punct { font-family: var(--f-display); font-size: 1.5rem; padding-bottom: .35rem; color: var(--muted); }
.reading { font-family: var(--f-display); font-size: 1.05rem; background: var(--bg); border-radius: 12px; padding: .6rem .85rem; overflow-wrap: anywhere; letter-spacing: .02em; }

/* Answer sheet */
label.field { display: grid; gap: .35rem; font-weight: 700; }
textarea { font: inherit; width: 100%; min-height: 4rem; padding: .65rem .8rem; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: .45rem; min-width: 0; }
legend { font-weight: 800; margin-bottom: .4rem; padding: 0; }
.opt { display: flex; gap: .6rem; align-items: flex-start; padding: .5rem .75rem; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.opt input { margin-top: .35rem; accent-color: var(--brand); }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }

/* Support cards */
.supports { display: grid; gap: .8rem; }
.sup { --c: var(--brand); --cs: var(--brand-soft); border: 2px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; min-width: 0; }
.sup[data-t="wl"]  { --c: var(--wl);  --cs: var(--wl-soft); }
.sup[data-t="bl"]  { --c: var(--bl);  --cs: var(--bl-soft); }
.sup[data-t="svr"] { --c: var(--svr); --cs: var(--svr-soft); }
.sup[data-t="avr"] { --c: var(--avr); --cs: var(--avr-soft); }
.sup[data-t="sl"]  { --c: var(--sl);  --cs: var(--sl-soft); }
.sup.open { border-color: var(--c); }
.sup-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding: .7rem .9rem; background: var(--cs); }
.sup-title { display: grid; gap: .05rem; min-width: 0; }
.sup-title b { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; color: var(--c); }
.sup-title span { font-size: .85rem; color: var(--muted); }
.sup-head button { border-color: var(--c); color: var(--c); padding: .3rem .8rem; flex: none; }
.sup-body { padding: .9rem; display: grid; gap: .7rem; }
.sup-body ul, .sup-body ol { margin: 0; padding-left: 1.15rem; display: grid; gap: .3rem; font-size: .95rem; }
.keygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.1rem, 1fr)); gap: .3rem; }
.keygrid div { display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--line); border-radius: 8px; padding: .05rem .35rem; font-family: var(--f-display); font-weight: 600; }
.keygrid .glyph { width: 1.35rem; height: 1.8rem; }
.keygrid .glyph .elv { width: 1.2rem; height: 1.65rem; }
dl { margin: 0; display: grid; gap: .35rem; }
dt { font-weight: 800; }
dd { margin: 0; color: var(--muted); font-size: .93rem; }
.art { border-radius: 12px; overflow: hidden; line-height: 0; }
.art svg { width: 100%; height: auto; display: block; }
.formula { font-family: var(--f-display); font-size: 1.05rem; text-align: center; padding: .5rem; border-radius: 10px; background: var(--cs); color: var(--c); font-weight: 600; }
.menu { display: grid; gap: .45rem; }
.menu button { text-align: left; border-color: var(--c); font-weight: 600; }
.menu button:disabled { opacity: .45; cursor: not-allowed; }
.note { font-size: .92rem; padding: .55rem .7rem; border-radius: 10px; background: var(--cs); }
.helped { display: grid; gap: .4rem; border-top: 2px dashed var(--line); padding-top: .7rem; }
.helped p { font-weight: 800; font-size: .92rem; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { font-size: .85rem; font-weight: 700; padding: .25rem .65rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--surface); }

/* Summary */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 30rem; font-size: .95rem; }
th, td { text-align: left; padding: .55rem .6rem; border-bottom: 2px solid var(--line); vertical-align: top; }
th { font-family: var(--f-display); font-weight: 500; font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
td.t b { font-family: var(--f-display); font-weight: 600; }
.pill { display: inline-block; font-size: .82rem; font-weight: 800; padding: .08rem .55rem; border-radius: 999px; margin: 0 .2rem .2rem 0; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.no { background: var(--warn-soft); color: var(--warn); }
.pill.na { background: var(--bg); color: var(--muted); }
.pill.tag { background: var(--brand-soft); color: var(--brand); }
.revealed { font-family: var(--f-display); font-size: 1.45rem; font-weight: 500; line-height: 1.3; color: var(--brand); }

/* Class board */
.board { display: grid; gap: 1.5rem; }
.stage-title { display: flex; align-items: center; gap: .6rem; }
.num { display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--brand); color: var(--surface); font-family: var(--f-display); font-weight: 600; flex: none; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: .6rem; }
.slot { min-height: 5.5rem; border: 2px dashed var(--line); border-radius: 14px; padding: .6rem; display: grid; gap: .3rem; align-content: start; text-align: left; background: transparent; font-weight: 400; }
.slot.filled { border-style: solid; border-color: var(--brand); background: var(--surface); }
.slot .n { font-family: var(--f-display); font-size: .8rem; color: var(--muted); }
.pile { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .6rem; }
.frag { text-align: left; display: grid; gap: .4rem; padding: .8rem; border-radius: 14px; font-weight: 400; }
.frag[disabled] { opacity: .3; cursor: default; }
.frag .gname { font-family: var(--f-display); font-weight: 600; color: var(--brand); }
.glyphline { display: flex; flex-wrap: wrap; align-items: center; row-gap: .15rem; color: var(--muted); }
.glyphline .elv { width: .95rem; height: 1.3rem; }
.glyphline .gap { width: .45rem; }
.glyphline .gp { font-family: var(--f-display); }
.result { padding: 1.1rem; border-radius: 16px; display: grid; gap: .6rem; }
.result.ok { background: var(--good-soft); }
.result.no { background: var(--warn-soft); }
.passage { font-family: var(--f-display); font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 500; line-height: 1.45; }
.qs { display: grid; gap: .6rem; padding-left: 1.2rem; margin: 0; font-size: 1.05rem; }
.theory-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .6rem; }
.theory-chip { --c: var(--brand); --cs: var(--brand-soft); padding: .7rem .85rem; border-radius: 14px; background: var(--cs); display: grid; gap: .2rem; }
.theory-chip b { font-family: var(--f-display); font-weight: 600; color: var(--c); }
.theory-chip span { font-size: .88rem; }
.theory-chip[data-t="wl"] { --c: var(--wl); --cs: var(--wl-soft); }
.theory-chip[data-t="bl"] { --c: var(--bl); --cs: var(--bl-soft); }
.theory-chip[data-t="svr"] { --c: var(--svr); --cs: var(--svr-soft); }
.theory-chip[data-t="avr"] { --c: var(--avr); --cs: var(--avr-soft); }
.theory-chip[data-t="sl"] { --c: var(--sl); --cs: var(--sl-soft); }
.fact { display: grid; gap: .45rem; padding: 1rem; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }
.fact .src { font-size: .85rem; color: var(--muted); }
.fact .q { font-weight: 800; }
.reveal-gate { display: grid; gap: .6rem; justify-items: start; }

/* Guide */
.guide { display: grid; gap: 1.6rem; max-width: 48rem; padding-block: 2.2rem; }
.guide section { display: grid; gap: .6rem; }
.guide ol, .guide ul { margin: 0; padding-left: 1.2rem; display: grid; gap: .35rem; }
.row { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: .3rem 1rem; padding: .55rem 0; border-bottom: 2px solid var(--line); }
@media (max-width: 30rem) { .row { grid-template-columns: minmax(0, 1fr); } }
.cite { font-size: .88rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .group-card:hover { transform: none; } }

/* v2: whole-sentence interpretation */
.elv-sentence { display: flex; flex-wrap: wrap; gap: 1rem 1.1rem; align-items: flex-end; padding: .4rem 0; }
.eword { display: flex; gap: .05rem; align-items: flex-end; padding: .3rem .35rem; border-radius: 10px; border: 2px solid transparent; background: none; font-weight: 400; cursor: pointer; }
.eword:hover { border-color: var(--line); }
.eword.sel { border-color: var(--brand); background: var(--brand-soft); }
.eword .glyph { width: 1.9rem; height: 2.6rem; }
.eword .glyph .elv { width: 1.75rem; height: 2.4rem; }
.eword .n { font-size: .7rem; color: var(--muted); align-self: flex-start; font-weight: 700; }
.epunct { font-family: var(--f-display); font-size: 1.6rem; color: var(--muted); padding-bottom: .3rem; }
.inline-elv { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0 .35rem; padding: .15rem .4rem; border-radius: 8px; background: var(--cs); vertical-align: middle; }
.inline-elv .w { display: inline-flex; }
.inline-elv .elv { width: 1rem; height: 1.35rem; }
.story { font-size: .98rem; line-height: 1.7; }
.clues { display: grid; gap: .4rem; }
.clue { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; padding: .45rem .7rem; border-radius: 12px; background: var(--bg); }
.clue b { font-family: var(--f-display); font-weight: 600; }
.clue button { margin-left: auto; padding: .1rem .55rem; font-size: .85rem; }
.add-clue { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: .5rem; align-items: end; }
@media (max-width: 34rem) { .add-clue { grid-template-columns: minmax(0, 1fr); } }
.add-clue label { display: grid; gap: .2rem; font-size: .85rem; font-weight: 700; }
input[type=text] { font: inherit; width: 100%; padding: .5rem .65rem; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.conf { display: flex; flex-wrap: wrap; gap: .4rem; }
.conf .opt { padding: .35rem .8rem; }
.sound { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .35rem; }
.sound div { display: flex; align-items: center; gap: .45rem; border: 2px solid var(--line); border-radius: 10px; padding: .2rem .45rem; font-size: .88rem; }
.sound .glyph { width: 1.35rem; height: 1.8rem; flex: none; }
.sound .glyph .elv { width: 1.2rem; height: 1.65rem; }
.sound b { font-family: var(--f-display); font-weight: 600; }
.pron { display: grid; gap: .35rem; }
.pron div { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .3rem .5rem; border-radius: 10px; background: var(--bg); }
.pron .inline-elv { background: none; padding: 0; }
.pron b { font-family: var(--f-display); font-weight: 600; letter-spacing: .03em; }
.pron button { margin-left: auto; padding: .1rem .6rem; font-size: .82rem; }
.panel-label { font-family: var(--f-display); font-weight: 600; color: var(--c); }
.pattern { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem; font-size: .92rem; }
.teacher { display: grid; gap: .55rem; }
.teacher .say { padding: .6rem .75rem; border-radius: 12px; background: var(--cs); font-size: .95rem; }
.teacher .say b { color: var(--c); }
.stuck { display: grid; gap: .35rem; }
.stuck button { text-align: left; border-color: var(--c); font-weight: 600; }
.crossed { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .5rem; }
.crossed div { padding: .5rem .7rem; border-radius: 12px; background: var(--surface); font-size: .92rem; }
.crossed b { font-family: var(--f-display); font-weight: 600; color: var(--brand); }

/* v3: calmer desk, tabbed resources */
.res { gap: .7rem; align-content: start; }
.tabs { display: flex; flex-wrap: wrap; gap: .35rem; }
.tab { --c: var(--brand); padding: .35rem .7rem; font-size: .88rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: .3rem; }
.tab[data-t="wl"] { --c: var(--wl); } .tab[data-t="bl"] { --c: var(--bl); } .tab[data-t="svr"] { --c: var(--svr); } .tab[data-t="avr"] { --c: var(--avr); } .tab[data-t="sl"] { --c: var(--sl); }
.tab:hover { border-color: var(--c); }
.tab[aria-selected="true"] { background: var(--c); border-color: var(--c); color: var(--surface); }
.tab .seen { font-size: .55rem; color: var(--c); }
.tab[aria-selected="true"] .seen { color: var(--surface); }
.sup-empty { padding: 1.1rem; border: 2px dashed var(--line); border-radius: 16px; color: var(--muted); font-size: .95rem; }
.clue-box { border-top: 2px dashed var(--line); padding-top: .8rem; display: grid; gap: .6rem; }
.clue-box summary { cursor: pointer; font-weight: 800; }
.clue-box[open] { gap: .6rem; }

    svr: { name: 'Simple View of Reading', page: 'p. 10', short: 'Decoding × language comprehension' },
    avr: { name: 'Active View of Reading', page: 'p. 11', short: 'Knowledge, word parts and self-checking' },
    sl:  { name: 'Structured Literacy', page: 'p. 11', short: 'Explicit, systematic sounds and patterns' }
  };
  const ORDER = ['wl', 'bl', 'svr', 'avr', 'sl'];
  const HELPED = ['Say the words', 'Know what words mean', 'See how it fits together', 'Get the big picture', 'Figure out what isn’t said', 'Not much yet'];

  // ---------- Illustrations ----------
  const ART = {
    lantern: `<svg viewBox="0 0 240 140" role="img" aria-label="An elf on a stone harbour wall lighting a lantern at sunset, boats far out at sea"><defs><linearGradient id="sk1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B3A7A"/><stop offset=".6" stop-color="#E9795B"/><stop offset="1" stop-color="#F6C27A"/></linearGradient><radialGradient id="gl1"><stop offset="0" stop-color="#FFE9A6"/><stop offset="1" stop-color="#FFE9A6" stop-opacity="0"/></radialGradient></defs><rect width="240" height="140" fill="url(#sk1)"/><circle cx="200" cy="92" r="14" fill="#FBD38D"/><rect y="96" width="240" height="44" fill="#2F5D8A"/><path d="M168 100l8-6h10l-4 6zM206 104l6-5h8l-3 5z" fill="#1E2A44"/><rect x="0" y="70" width="120" height="70" fill="#7C7266"/><path d="M0 84h120M0 98h120M0 112h120M30 70v14M70 84v14M40 98v14M90 112v14" stroke="#5E564C" stroke-width="2"/><circle cx="84" cy="46" r="32" fill="url(#gl1)"/><rect x="80" y="60" width="8" height="10" fill="#3A3A3A"/><rect x="72" y="34" width="24" height="28" rx="4" fill="#FFD66B" stroke="#3A3A3A" stroke-width="3"/><path d="M72 34l12-10 12 10" fill="#3A3A3A"/><circle cx="40" cy="38" r="8" fill="#2E4E6E"/><path d="M40 30l-3-7 6 4z" fill="#2E4E6E"/><rect x="32" y="46" width="16" height="24" rx="6" fill="#2E4E6E"/><path d="M48 52l20-6" stroke="#2E4E6E" stroke-width="4" stroke-linecap="round"/></svg>`,
    stones: `<svg viewBox="0 0 240 140" role="img" aria-label="A row of stones along a path, a small gift half-hidden under the third stone"><rect width="240" height="140" fill="#D8EEDC"/><path d="M0 96q60-18 120-6t120-8V140H0z" fill="#B7D8A8"/><path d="M10 108q110-30 220-12" stroke="#E8DCC0" stroke-width="16" fill="none" stroke-linecap="round"/><ellipse cx="40" cy="100" rx="18" ry="10" fill="#8F8A80"/><ellipse cx="92" cy="92" rx="18" ry="10" fill="#8F8A80"/><ellipse cx="146" cy="88" rx="18" ry="10" fill="#A3978A"/><ellipse cx="200" cy="90" rx="18" ry="10" fill="#8F8A80"/><rect x="156" y="92" width="12" height="10" rx="1.5" fill="#C7356F"/><path d="M162 92v10M156 96h12" stroke="#FCE8D7" stroke-width="2"/><path d="M162 92l-4-4M162 92l4-4" stroke="#C7356F" stroke-width="2" stroke-linecap="round"/><path d="M146 70l-4-8M146 70l4-8" stroke="#6B8F5E" stroke-width="2"/></svg>`,
    mill: `<svg viewBox="0 0 240 140" role="img" aria-label="An old mill at the end of a sandy path while the sea creeps in from both sides"><rect width="240" height="140" fill="#D9ECF5"/><rect y="70" width="240" height="70" fill="#E8D7AE"/><path d="M0 92q30-10 60 0t60 0V140H0z" fill="#4A8BC0"/><path d="M130 118q30-10 55 0t55 0V140H130z" fill="#4A8BC0"/><path d="M60 140L150 72h14L100 140z" fill="#C9B384"/><rect x="160" y="30" width="44" height="46" fill="#B9A38A"/><path d="M156 32l26-20 26 20z" fill="#8B5E3C"/><rect x="176" y="52" width="12" height="24" fill="#6B4A2E"/><circle cx="214" cy="60" r="16" fill="none" stroke="#6B4A2E" stroke-width="4"/><path d="M214 44v32M198 60h32" stroke="#6B4A2E" stroke-width="3"/><circle cx="96" cy="100" r="6" fill="#5C4B8A"/><rect x="91" y="106" width="10" height="16" rx="4" fill="#5C4B8A"/></svg>`,
    gate: `<svg viewBox="0 0 240 140" role="img" aria-label="An ancient stone archway at the end of a path"><rect width="240" height="140" fill="#E6EEF7"/><path d="M0 104q60-10 120 0t120-4V140H0z" fill="#B7D8A8"/><path d="M40 140L112 96h16L200 140z" fill="#E8DCC0"/><path d="M84 104V40a36 36 0 0 1 72 0v64h-16V44a20 20 0 0 0-40 0v60z" fill="#9A9187"/><path d="M84 60h16M84 80h16M140 60h16M140 80h16M100 30l-8-10M140 30l8-10" stroke="#7A7268" stroke-width="2"/><rect x="100" y="44" width="40" height="60" fill="#3E3A36" opacity=".35"/><path d="M160 60q14-20 10-40" stroke="#6B8F5E" stroke-width="3" fill="none"/></svg>`,
    door: `<svg viewBox="0 0 240 140" role="img" aria-label="An elf standing at a great gate with no handle, speaking to it"><rect width="240" height="140" fill="#E9E2F5"/><rect x="120" y="14" width="80" height="126" rx="40" fill="#8B5E3C"/><path d="M160 14v126M120 60h80M120 100h80" stroke="#6B4A2E" stroke-width="3"/><circle cx="62" cy="62" r="14" fill="#5C4B8A"/><path d="M62 48l-4-9 8 5z" fill="#5C4B8A"/><rect x="48" y="78" width="28" height="50" rx="12" fill="#5C4B8A"/><path d="M80 40h30a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8H94l-8 8v-8h-6a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8z" fill="#FFFFFF" stroke="#5C4B8A" stroke-width="2"/><circle cx="88" cy="54" r="2.5" fill="#5C4B8A"/><circle cx="96" cy="54" r="2.5" fill="#5C4B8A"/><circle cx="104" cy="54" r="2.5" fill="#5C4B8A"/></svg>`,
    listen: `<svg viewBox="0 0 240 140" role="img" aria-label="An open doorway with letters carved above it and two elves leaning in to listen"><rect width="240" height="140" fill="#E4F2E9"/><rect x="90" y="20" width="100" height="120" fill="#B9A38A"/><rect x="118" y="56" width="44" height="84" rx="22" fill="#2F2A26"/><rect x="104" y="30" width="72" height="14" rx="3" fill="#D6C29E"/><path d="M112 37h8M124 37h6M134 37h10M148 37h6M158 37h10" stroke="#6B4A2E" stroke-width="2.5" stroke-linecap="round"/><circle cx="46" cy="70" r="12" fill="#2E7D5B"/><rect x="34" y="84" width="24" height="44" rx="10" fill="#2E7D5B"/><circle cx="74" cy="74" r="11" fill="#D8651A"/><rect x="63" y="87" width="22" height="41" rx="10" fill="#D8651A"/><path d="M92 70q8 6 0 12M98 64q14 12 0 24" stroke="#2F2A26" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`
  };

  // ---------- The passage: real Quenya, every word attested in Eldamo ----------
  const FRAGS = [
    { id: 'river', group: 'River', order: 1, elv: 'I tirmo caltanë i calma andúnessë.', en: 'The watcher kindled the lamp at evening.', art: 'lantern',
      pron: ['ee', 'TEER-mo', 'KAL-ta-neh', 'ee', 'KAL-ma', 'an-doo-NES-seh'],
      heard: [['i', 'the'], ['tirmo', 'watcher'], ['caltanë', 'kindled, lit (in the past)'], ['calma', 'lamp']],
      story: ['The sun sank behind the hills, and the fishing boats were still far out at sea. The old watcher climbed the harbour wall with a spark-stone in her hand.', 'Soon a small light glowed over the water, and one by one the boats turned toward home.'],
      background: 'At evening, lamps are lit on the harbour wall so that boats can find their way home.',
      parts: [['-mo', 'a person who does something (tir- = to watch)'], ['-ssë', 'at, in: where or when something happens'], ['cal-', 'a root about light; it appears in more than one word here']],
      fits: 'First comes who acted, then what they did, then what they did it to. The last word says when.',
      lesson: 'Look at the first word: one short stroke with a dot above. A vowel with no consonant before it sits on a short carrier, and the dot means i.' },
    { id: 'moon', group: 'Moon', order: 2, elv: 'I anna caita nu i nelya ondo.', en: 'The gift lies under the third stone.', art: 'stones',
      pron: ['ee', 'AN-na', 'KY-ta', 'noo', 'ee', 'NEL-ya', 'ON-do'],
      heard: [['i', 'the'], ['anna', 'gift'], ['caita', 'lies, rests'], ['ondo', 'stone']],
      story: ['Before she left, the watcher hid something small and precious. She counted the stones along the path, one, two, three, and tucked it beneath one.', 'Whoever finds it will know where to go next.'],
      background: 'People here mark hiding places by counting stones along a path.',
      parts: [['nelya', 'an order word, like “first” or “second”'], ['nu', 'a short word that shows position']],
      fits: 'First comes a thing, then what it does, then where it is.',
      lesson: 'Find the letter with a bar underneath in word 2. The bar doubles the letter, so n becomes nn.' },
    { id: 'oak', group: 'Oak', order: 3, elv: 'Á colë i anna i yára andonna.', en: 'Carry the gift to the old gate.', art: 'gate',
      pron: ['ah', 'KO-leh', 'ee', 'AN-na', 'ee', 'YAH-ra', 'an-DON-na'],
      heard: [['i', 'the'], ['colë', 'carry, bear'], ['yára', 'old, ancient']],
      story: ['At the end of the path stands a gate older than anyone can remember. What was hidden was never meant to stay hidden.', 'The gate has waited a long time.'],
      background: 'The old gate stands at the end of the path that leads away from the stones.',
      parts: [['á', 'marks a command: someone is being told to do something'], ['-nna', 'to, towards: movement to a place']],
      fits: 'The first word shows this is an instruction. Then comes what to carry, then where to take it.',
      lesson: 'The first word is a single long carrier with three dots on top: a long “á”. Long vowels sit on the long carrier.' },
    { id: 'fern', group: 'Fern', order: 4, elv: 'Andossë, á quetë essërya.', en: 'At the gate, speak its name.', art: 'door',
      pron: ['an-DOS-seh', 'ah', 'KWEH-teh', 'es-SER-ya'],
      heard: [['quetë', 'speak, say'], ['essë', 'name']],
      story: ['The great gate has no handle and no lock. Travelers pound on it, and nothing happens.', 'Only then does the old stone begin to shift.'],
      background: 'Old gates here open only to the right words.',
      parts: [['-ssë', 'at, in: where something happens'], ['-rya', 'his, her, its'], ['á', 'marks a command']],
      fits: 'The part before the comma says where. After the comma is an instruction.',
      lesson: 'In the last word, two dots under a letter add a “y” sound after it.' },
    { id: 'star', group: 'Star', order: 5, elv: 'Essërya ná Lindë. Á lasta!', en: 'Its name is Lindë (“song”). Listen!', art: 'listen',
      pron: ['es-SER-ya', 'nah', 'LIN-deh', 'ah', 'LAS-ta'],
      heard: [['ná', 'is'], ['Lindë', 'a name; as a word it means “song”'], ['lasta', 'listen']],
      story: ['Carved above the gate, worn soft by the wind, is a single word. Few people stop to read it.', 'The ones who do hear music, faint and far away.'],
      background: 'Old places here have secret names, and many of them mean something beautiful.',
      parts: [['-rya', 'his, her, its'], ['á', 'marks a command']],
      fits: 'There are two sentences. The first names something. The second is a short instruction.',
      lesson: 'Look at the very last mark. It works like an exclamation point. What kind of sentence ends that way?' }
  ];
  const byId = Object.fromEntries(FRAGS.map(f => [f.id, f]));
  const CROSSED = [['i', 'the', 'River, Moon, Oak'], ['anna', 'gift', 'Moon, Oak'], ['ando', 'gate (andonna, andossë)', 'Oak, Fern'], ['essë', 'name (essërya)', 'Fern, Star'], ['á', 'command', 'Oak, Fern, Star'], ['-ssë', 'at, in', 'River, Fern'], ['-rya', 'its', 'Fern, Star']];
  const wordsOf = f => f.elv.split(' ').map(w => w.replace(/[.,!]/g, ''));

  // ---------- State ----------
  const KEY = 'five-ways-in-v2';
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { S = null; }
  if (!S || !S.groups) S = { group: null, groups: {}, board: { order: [], show: false, step: 1 } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const gs = id => {
    if (!S.groups[id]) S.groups[id] = { stage: 'look', first: '', open: [], helped: {}, clues: [], meaning: '', confidence: '', noticed: '', teacher: [], revealed: false };
    return S.groups[id];
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = document.getElementById('app');
  const canSpeak = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
  let selWord = null, askMeaning = false;
  const sayAloud = txt => { try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.rate = 0.8; window.speechSynthesis.speak(u); } catch (e) {} };

  // ---------- Routing ----------
  const route = () => { const h = (location.hash || '').replace('#', ''); return ['board', 'guide'].includes(h) ? h : 'play'; };
  document.querySelectorAll('[data-route]').forEach(b => b.addEventListener('click', () => {
    const r = b.dataset.route; if (r === 'play') { if (location.hash) location.hash = ''; render(); } else location.hash = r;
  }));
  window.addEventListener('hashchange', render);
  function render() {
    const r = route();
    document.querySelectorAll('[data-route]').forEach(b => { if (b.dataset.route === r) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (r === 'board') return renderBoard();
    if (r === 'guide') return renderGuide();
    if (!S.group) return renderPicker();
    return renderDesk();
  }
  const rainbow = `<div class="rainbow" aria-hidden="true">${ORDER.map(t => `<i style="background:var(--${t})"></i>`).join('')}</div>`;

  // ---------- Picker ----------
  function renderPicker() {
    app.innerHTML = `
      <section class="intro">
        ${rainbow}
        <p class="eyebrow">An Elvish reading challenge</p>
        <h1>Five sentences. One lost passage.</h1>
        <p>Your group will get one sentence of a passage in Quenya, one of Tolkien’s Elvish languages, written in Tengwar, his Elvish alphabet. Work out what it means. You’ll have five resources, each built on a different approach to reading instruction. When every group is ready, the class puts the whole passage back together.</p>
        <p class="muted">Pick the group your facilitator gave you. One device per group.</p>
      </section>
      <div class="groups">
        ${['oak', 'moon', 'fern', 'river', 'star'].map(id => { const f = byId[id]; return `
          <button type="button" class="group-card" data-g="${id}">
            <span class="group-name">${f.group} group</span>
            <span class="preview" aria-hidden="true">${tw(twText(f.elv.split(' ').slice(0, 2).join(' ')))}</span>
          </button>`; }).join('')}
      </div>`;
    app.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { S.group = b.dataset.g; save(); render(); window.scrollTo(0, 0); }));
  }

  // ---------- Desk ----------
  const STAGES = [['look', 'First look'], ['work', 'Five ways in'], ['done', 'Share']];
  function renderDesk() {
    const f = byId[S.group], st = gs(S.group);
    const idx = STAGES.findIndex(s => s[0] === st.stage);
    const body = st.stage === 'look' ? lookView(f, st) : st.stage === 'work' ? workView(f, st) : doneView(f, st);
    app.innerHTML = `
      <div class="desk-head">
        <div style="display:grid;gap:.3rem"><p class="eyebrow">Your group</p><h2>${f.group} group</h2></div>
        <ol class="steps" aria-label="Progress">${STAGES.map((s, i) => `<li class="${i === idx ? 'on' : i < idx ? 'done' : ''}">${i + 1}. ${s[1]}</li>`).join('')}</ol>
      </div>
      ${body}
      <p style="margin-top:2rem" class="muted">Wrong group? <button type="button" class="link" id="switch">Choose a different group</button></p>`;
    document.getElementById('switch').addEventListener('click', () => { S.group = null; save(); render(); });
    wireDesk(f, st);
  }

  function sentenceHTML(f, interactive) {
    const parts = f.elv.split(' ');
    return parts.map((w, i) => {
      const clean = w.replace(/[.,!]/g, ''), p = /[.,!]$/.test(w) ? w.slice(-1) : '';
      const inner = `<span class="n">${i + 1}</span>${wordGlyphs(clean)}`;
      const word = interactive ? `<button type="button" class="eword${selWord === i ? ' sel' : ''}" data-w="${i}" aria-label="Elvish word ${i + 1}">${inner}</button>` : `<span class="eword" style="cursor:default">${inner}</span>`;
      return word + (p ? `<span class="epunct" aria-hidden="true">${tw(TWP[p])}</span>` : '');
    }).join('');
  }

  function lookView(f, st) {
    return `<div class="col" style="max-width:50rem">
      <section class="card">
        <div style="display:grid;gap:.35rem"><h3>Your sentence</h3><p class="muted">No help yet. Look closely. What do you notice? Any repeated letters, long or short words, punctuation?</p></div>
        <div class="elv-sentence">${sentenceHTML(f, false)}</div>
        <p class="muted small">In Tengwar, a single dot marks a pause and two dots end a sentence.</p>
        <label class="field" for="first">Your first guess<textarea id="first" placeholder="What do you notice? What might it be about?">${esc(st.first)}</textarea></label>
        <div class="actions"><button type="button" class="primary" id="go">Open the five resources</button></div>
      </section>
    </div>`;
  }

  function soundChart(f) {
    const d = TW[f.id];
    return `<div class="sound">${d.letters.map(l => `<div>${tw(l.c)}<span><b>${l.name}</b> · ${l.say}</span></div>`).join('')}</div>`;
  }
  function markChart(f) {
    const d = TW[f.id];
    return `<div class="sound">${d.marks.map(m => `<div>${tw(m.c)}<span><b>${m.say}</b> · ${m.name}</span></div>`).join('')}</div>`;
  }

  function supportBody(t, f, st) {
    if (t === 'wl') return `
      <div class="art">${ART[f.art]}</div>
      <p class="story">${esc(f.story[0])} ${inlineElv(f.elv)} ${esc(f.story[1])}</p>
      <ul><li>What would make sense here, given the story and the picture?</li><li>What might the Elvish sentence be saying at this point in the story?</li><li>Read the whole story again with your idea in place. Does it still make sense?</li></ul>`;
    if (t === 'bl') {
      const log = st.teacher.map(x => `<div class="say">${x}</div>`).join('');
      return `<div class="teacher">
        <div class="say"><b>Teacher:</b> Tell me what you’ve noticed so far.</div>
        <label class="field small" for="noticed" style="font-weight:700">What we’ve noticed<textarea id="noticed" style="min-height:3rem">${esc(st.noticed)}</textarea></label>
        <div class="say"><b>Teacher:</b> Where are you stuck right now?</div>
        <div class="stuck">
          <button type="button" data-stuck="sound">Saying the words</button>
          <button type="button" data-stuck="meaning">What one word means</button>
          <button type="button" data-stuck="fits">How the sentence fits together</button>
          <button type="button" data-stuck="unsure">We’re not sure where to start</button>
        </div>
        <div id="teacher-log" class="teacher">${log}</div>
      </div>`;
    }
    if (t === 'svr') return `
      <p class="formula">Reading = Decoding × Language comprehension</p>
      <p class="panel-label">Decoding: how the words sound</p>
      <div class="pron">${wordsOf(f).map((w, i) => `<div><span class="small muted">${i + 1}</span>${inlineElv(w)}<b>${f.pron[i]}</b>${canSpeak ? `<button type="button" data-say="${esc(w)}">Hear it</button>` : ''}</div>`).join('')}</div>
      <p class="panel-label">Language comprehension: words you’d know if you heard them</p>
      <dl>${f.heard.map(h => `<dt>“${esc(h[0])}”</dt><dd>${esc(h[1])}</dd>`).join('')}</dl>
      <p class="small muted">You need both panels: match what you hear to what is written.</p>`;
    if (t === 'avr') return `
      <p class="small"><b>What elves here already know:</b> ${esc(f.background)}</p>
      <p class="small"><b>Word parts and what they mean</b></p><ul>${f.parts.map(p => `<li><b>${esc(p[0])}</b>: ${esc(p[1])}</li>`).join('')}</ul>
      <p class="small"><b>Check yourselves</b></p>
      <ul><li>Does your idea fit every word, or are you ignoring one?</li><li>What do you know that the sentence doesn’t say?</li><li>Could a word part here also appear in another group’s sentence?</li></ul>`;
    if (t === 'sl') return `
      <p class="small"><b>Lesson 1: letters.</b> Tengwar letters stand for consonants. Here is every letter in your sentence, with its Elvish name and sound.</p>
      ${soundChart(f)}
      <p class="small"><b>Lesson 2: vowel marks.</b> Vowels are marks written <i>above the letter that comes before them</i>, shown here on example letters. A vowel with no letter before it sits on a carrier.</p>
      ${markChart(f)}
      <p class="small muted">Point, say, blend, left to right. This lesson teaches how to say the words, not what they mean.</p>`;
    return '';
  }

  function resourcePanel(f, st) {
    const cur = st.tab;
    const tabs = `<div class="tabs" role="tablist" aria-label="Five resources">${ORDER.map(t => `<button type="button" role="tab" class="tab" data-t="${t}" data-tab="${t}" aria-selected="${cur === t}">${T[t].name}${st.open.includes(t) ? '<span class="seen" aria-label="opened"> ✓</span>' : ''}</button>`).join('')}</div>`;
    if (!cur) return `${tabs}<div class="sup-empty">Pick a resource to open it. Use them in any order, as you need them. Notice what each one helps you do.</div>`;
    const helped = st.helped[cur] || [];
    return `${tabs}<section class="sup open" data-t="${cur}" role="tabpanel">
      <div class="sup-head"><div class="sup-title"><b>${T[cur].name}</b><span>${T[cur].short}</span><span class="helped-line" id="helped-line">✓ Opened${helped.length ? ' · Helped us: ' + helped.map(k => HELPED[k]).join(' · ') : ''}</span></div></div>
      <div class="sup-body">${supportBody(cur, f, st)}
        <div class="helped"><p>This helped us…</p><div class="chips">${HELPED.map((h, k) => `<button type="button" class="chip" data-help="${cur}" data-k="${k}" aria-pressed="${helped.includes(k)}">${h}</button>`).join('')}</div></div>
      </div>
    </section>`;
  }

  function workView(f, st) {
    return `<div class="desk">
      <div class="col">
        <section class="card">
          <p class="eyebrow">Your Elvish sentence</p>
          <div class="elv-sentence" id="sentence">${sentenceHTML(f, true)}</div>
        </section>
        <section class="card">
          <label class="field" for="meaning">Our current interpretation <span class="muted small" style="font-weight:400">Revise it as you try each resource. It doesn’t need to be word for word.</span><textarea id="meaning" style="min-height:4.5rem">${esc(st.meaning)}</textarea></label>
          <fieldset><legend>Confidence</legend><div class="conf">${['Low', 'Medium', 'High'].map(c => `<label class="opt"><input type="radio" name="confidence" id="conf-${c}" value="${c}" ${st.confidence === c ? 'checked' : ''}><span>${c}</span></label>`).join('')}</div></fieldset>
        </section>
        <section class="card">
          <div style="display:grid;gap:.2rem"><h3>Clue notebook</h3><p class="muted small">Optional. Tap a word above, then note what you think it, or part of it, means.</p></div>
          <div class="clues" id="clues">${st.clues.map((c, i) => `<div class="clue"><b>${esc(c.el)}</b><span>→ ${esc(c.means)}</span><button type="button" data-del="${i}" aria-label="Remove clue">Remove</button></div>`).join('')}</div>
          <div class="add-clue">
            <label for="clue-el">Word or part<input type="text" id="clue-el" placeholder="e.g. word 2"></label>
            <label for="clue-means">We think it means<input type="text" id="clue-means" placeholder="e.g. maybe “door”"></label>
            <button type="button" id="add-clue">+ Add clue</button>
          </div>
        </section>
        <div class="actions"><button type="button" class="primary" id="finish">We’re ready to share</button></div>
      </div>
      <aside class="col res" aria-label="Five resources" id="res">
        <h3>Five ways in</h3>
        ${resourcePanel(f, st)}
      </aside>
    </div>`;
  }

  const ordinal = n => ['First', 'Second', 'Third', 'Fourth', 'Fifth'][n - 1] || n;
  function doneView(f, st) {
    return `<div class="col" style="max-width:54rem">
      <section class="card">
        <p class="eyebrow">Share this with the class</p>
        <div class="elv-sentence">${sentenceHTML(f, false)}</div>
        <div class="table-wrap"><table><tbody>
          <tr><th scope="row">First guess</th><td>${st.first ? esc(st.first) : '<span class="muted">—</span>'}</td></tr>
          <tr><th scope="row">What we think it means</th><td><b>${st.meaning ? esc(st.meaning) : '—'}</b></td></tr>
          <tr><th scope="row">Confidence</th><td>${st.confidence || '—'}</td></tr>
          <tr><th scope="row">Clues</th><td>${st.clues.length ? st.clues.map(c => `<span class="pill tag">${esc(c.el)} → ${esc(c.means)}</span>`).join('') : '<span class="muted">—</span>'}</td></tr>
        </tbody></table></div>
      </section>
      <section class="card">
        <h3>What each resource helped you do</h3>
        <div class="table-wrap"><table>
          <thead><tr><th scope="col">Resource</th><th scope="col">Opened</th><th scope="col">Helped us…</th></tr></thead>
          <tbody>${ORDER.map(t => { const o = st.open.indexOf(t); const h = st.helped[t] || []; return `<tr><td class="t"><b style="color:var(--${t})">${T[t].name}</b></td><td>${o < 0 ? '<span class="muted">Not opened</span>' : ordinal(o + 1)}</td><td>${h.length ? h.map(k => `<span class="pill tag">${HELPED[k]}</span>`).join('') : '<span class="muted">—</span>'}</td></tr>`; }).join('')}</tbody>
        </table></div>
      </section>
      <section class="card">
        ${st.revealed ? `<p class="eyebrow">Our sentence means</p><p class="revealed">${esc(f.en)}</p>` : `<p class="muted">After you share with the class, you can check your interpretation.</p><div class="actions"><button type="button" id="reveal">Check our interpretation</button></div>`}
        <div class="actions"><button type="button" id="back">Back to the resources</button><button type="button" id="restart">Start over</button></div>
      </section>
    </div>`;
  }

  function wireDesk(f, st) {
    const go = document.getElementById('go');
    if (go) {
      document.getElementById('first').addEventListener('input', e => { st.first = e.target.value; save(); });
      go.addEventListener('click', () => { st.stage = 'work'; save(); renderDesk(); window.scrollTo(0, 0); });
      return;
    }
    const words = wordsOf(f);
    app.querySelectorAll('#sentence .eword').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.w);
      if (askMeaning) {
        askMeaning = false;
        const heard = f.heard.find(h => h[0].toLowerCase() === words[i].toLowerCase());
        const gloss = heard ? heard[1] : (f.parts.find(p => words[i].toLowerCase().includes(p[0].replace(/-/g, ''))) || [])[1];
        st.teacher.push(`<b>Teacher:</b> Word ${i + 1}? ${gloss ? `Think of it as “${esc(gloss)}.”` : (words[i].length <= 3 ? 'That one is small. Read the words around it and ask what would connect them.' : 'I won’t give that one away. Has another group got a word that looks like it?')}`);
        save(); renderDesk(); scrollToCard('bl'); return;
      }
      selWord = i;
      app.querySelectorAll('#sentence .eword').forEach(x => x.classList.toggle('sel', Number(x.dataset.w) === i));
      const el = document.getElementById('clue-el'); el.value = `word ${i + 1}`; document.getElementById('clue-means').focus();
    }));
    const add = document.getElementById('add-clue');
    if (add) add.addEventListener('click', () => {
      const el = document.getElementById('clue-el').value.trim(), means = document.getElementById('clue-means').value.trim();
      if (!el || !means) { document.getElementById(el ? 'clue-means' : 'clue-el').focus(); return; }
      st.clues.push({ el, means }); selWord = null; save(); renderDesk();
    });
    app.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { st.clues.splice(Number(b.dataset.del), 1); save(); renderDesk(); }));
    const m = document.getElementById('meaning'); if (m) m.addEventListener('input', e => { st.meaning = e.target.value; save(); });
    app.querySelectorAll('input[name=confidence]').forEach(r => r.addEventListener('change', () => { st.confidence = r.value; save(); }));
    const nt = document.getElementById('noticed'); if (nt) nt.addEventListener('input', e => { st.noticed = e.target.value; save(); });
    app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.tab; st.tab = t; if (!st.open.includes(t)) st.open.push(t); save(); renderDesk(); scrollToCard(t);
    }));
    app.querySelectorAll('[data-help]').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.help, k = Number(b.dataset.k), arr = st.helped[t] || (st.helped[t] = []);
      const at = arr.indexOf(k); if (at < 0) arr.push(k); else arr.splice(at, 1);
      b.setAttribute('aria-pressed', String(at < 0)); save();
      const hl = document.getElementById('helped-line'); if (hl) hl.textContent = '✓ Opened' + (arr.length ? ' · Helped us: ' + arr.map(x => HELPED[x]).join(' · ') : '');
    }));
    app.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => sayAloud(b.dataset.say)));
    app.querySelectorAll('[data-stuck]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.stuck, noticed = (st.noticed || '').trim();
      const open = noticed ? `You noticed: “${esc(noticed.length > 80 ? noticed.slice(0, 80) + '…' : noticed)}” Good. ` : '';
      if (k === 'sound') st.teacher.push(`<b>Teacher:</b> ${open}${esc(f.lesson)}`);
      if (k === 'fits') st.teacher.push(`<b>Teacher:</b> ${open}${esc(f.fits)}`);
      if (k === 'unsure') st.teacher.push(`<b>Teacher:</b> ${open}Let’s try just the first word or two. What kind of word usually starts a sentence like this? Then pick one other resource and see what it adds.`);
      if (k === 'meaning') { askMeaning = true; st.teacher.push(`<b>Teacher:</b> ${open}Which word? Tap it in your sentence.`); save(); renderDesk(); document.getElementById('sentence').scrollIntoView({ block: 'center' }); return; }
      save(); renderDesk(); scrollToCard('bl');
    }));
    const fin = document.getElementById('finish'); if (fin) fin.addEventListener('click', () => { st.stage = 'done'; save(); renderDesk(); window.scrollTo(0, 0); });
    const rev = document.getElementById('reveal'); if (rev) rev.addEventListener('click', () => { st.revealed = true; save(); renderDesk(); });
    const back = document.getElementById('back'); if (back) back.addEventListener('click', () => { st.stage = 'work'; save(); renderDesk(); window.scrollTo(0, 0); });
    const restart = document.getElementById('restart'); if (restart) restart.addEventListener('click', () => { delete S.groups[f.id]; save(); renderDesk(); window.scrollTo(0, 0); });
  }
  function scrollToCard() { const c = document.getElementById('res'); if (c) c.scrollIntoView({ block: 'nearest' }); }

  // ---------- Class board ----------
  function renderBoard() {
    const B = S.board; if (!B.step) B.step = 1;
    const full = B.order.length === 5;
    const correct = full && B.order.every((id, i) => byId[id].order === i + 1);
    const pile = ['oak', 'moon', 'fern', 'river', 'star'];
    const line = f => `<span class="glyphline" aria-hidden="true">${tw(TW[f.id].tw)}</span>`;
    app.innerHTML = `
      <section class="intro">
        ${rainbow}
        <p class="eyebrow">Class board · shared screen</p>
        <h1>Put the passage back together.</h1>
        <p>Each group reads what it thinks its sentence means, and shares any clues. Then decide the order as a class. Tap a sentence to place it; tap a slot to send it back.</p>
        <label class="opt" style="width:fit-content"><input type="checkbox" id="show" ${B.show ? 'checked' : ''}><span>Show the English meanings</span></label>
      </section>
      <div class="board">
        <section class="card">
          <div class="stage-title"><span class="num">1</span><h2>Rebuild the passage</h2></div>
          <div class="slots">${[0, 1, 2, 3, 4].map(i => { const id = B.order[i]; return id
            ? `<button type="button" class="slot filled" data-slot="${i}"><span class="n">Sentence ${i + 1}</span><span style="font-family:var(--f-display);font-weight:600;color:var(--brand)">${byId[id].group}</span>${B.show ? `<span class="small">${esc(byId[id].en)}</span>` : ''}</button>`
            : `<div class="slot"><span class="n">Sentence ${i + 1}</span></div>`; }).join('')}</div>
          <div class="pile">${pile.map(id => { const f = byId[id]; return `<button type="button" class="frag" data-frag="${id}" ${B.order.includes(id) ? 'disabled' : ''}><span class="gname">${f.group} group</span>${line(f)}${B.show ? `<span class="small">${esc(f.en)}</span>` : ''}</button>`; }).join('')}</div>
          ${full ? (correct
            ? `<div class="result ok"><p class="eyebrow">Passage recovered</p>
                <p class="passage">${FRAGS.slice().sort((a, b) => a.order - b.order).map(f => esc(f.en)).join(' ')}</p>
                <p class="small" style="font-style:italic">${FRAGS.slice().sort((a, b) => a.order - b.order).map(f => esc(f.elv)).join(' ')}</p>
                <p><b>Words that crossed sentences.</b> No group had the whole passage. These shared words and word parts helped connect the fragments:</p>
                <div class="crossed">${CROSSED.map(c => `<div><b>${esc(c[0])}</b> “${esc(c[1])}” · ${c[2]}</div>`).join('')}</div></div>`
            : `<div class="result no"><p><b>Not quite.</b> Listen for connections. Which sentences share a word? Which sentence asks for something another one gives?</p></div>`) : ''}
          <div class="actions"><button type="button" id="clear">Clear the slots</button></div>
        </section>

        <section class="card">
          <div class="stage-title"><span class="num">2</span><h2>What helped, and with what?</h2></div>
          <p class="muted">Each group shares its “what each resource helped you do” screen.</p>
          <ol class="qs">
            <li>Which resources helped you <b>say the words</b>?</li>
            <li>Which helped you <b>make meaning</b>, understanding and going beyond the words?</li>
            <li>Did any one resource do everything?</li>
            <li>What happened when you combined them? Which did you open first, and why?</li>
            <li>Which words or word parts did you recognize from another group’s sentence?</li>
          </ol>
          <div class="theory-row">${ORDER.map(t => `<div class="theory-chip" data-t="${t}"><b>${T[t].name}</b><span>${T[t].short} (Thomas, 2022, ${T[t].page})</span></div>`).join('')}</div>
        </section>

        <section class="card">
          <div class="stage-title"><span class="num">3</span><h2>From Elvish to North Carolina</h2></div>
          ${B.step < 3 ? `<div class="reveal-gate"><p class="muted">Open this after the discussion.</p><button type="button" class="primary" id="next">Connect it to NC</button></div>` : `
          <div class="fact"><p>North Carolina’s Excellent Public Schools Act of 2021 defines the Science of Reading as covering language, phonological and phonemic awareness, phonics and spelling, fluency, vocabulary, oral language and comprehension.</p><p class="src">North Carolina General Assembly, 2021, Part II (G.S. 115C-83.3(7a))</p><p class="q">Which of today’s five resources does that definition draw on? Which does it leave out?</p></div>
          <div class="fact"><p>To carry out the law, the state trained every K–5 teacher in LETRS. Rowe and Thrailkill, who completed the training, argue it focused mainly on phonemic awareness, phonics and spelling, with thinner treatment of vocabulary, comprehension and writing.</p><p class="src">Rowe & Thrailkill, 2025, pp. 4, 11</p><p class="q">If your group had only one of today’s resources, which would you have chosen, and what would you have missed?</p></div>
          <div class="fact"><p>Thomas argues that the reading debate keeps swinging between approaches, and that no single theory should be treated as the whole answer.</p><p class="src">Thomas, 2022</p><p class="q">After today, where do you agree or disagree? What should a reading policy guarantee in every classroom, and where should teachers decide?</p></div>`}
        </section>
      </div>`;
    document.getElementById('show').addEventListener('change', e => { B.show = e.target.checked; save(); renderBoard(); });
    app.querySelectorAll('[data-frag]').forEach(b => b.addEventListener('click', () => { if (B.order.length < 5 && !B.order.includes(b.dataset.frag)) { B.order.push(b.dataset.frag); save(); renderBoard(); } }));
    app.querySelectorAll('[data-slot]').forEach(b => b.addEventListener('click', () => { B.order.splice(Number(b.dataset.slot), 1); save(); renderBoard(); }));
    document.getElementById('clear').addEventListener('click', () => { B.order = []; save(); renderBoard(); });
    const nx = document.getElementById('next'); if (nx) nx.addEventListener('click', () => { B.step = 3; save(); renderBoard(); });
  }

  // ---------- Guide ----------
  function renderGuide() {
    app.innerHTML = `
      <div class="guide">
        <section>${rainbow}<p class="eyebrow">Facilitator guide</p><h1>Running Five Ways In</h1>
          <p>Five groups each get one sentence of a short passage in Quenya, one of J.R.R. Tolkien’s Elvish languages, written in Tengwar in the Classical Quenya mode. Every word is attested in Eldamo, the scholarly lexicon of Tolkien’s languages, and some words and endings appear in more than one sentence. Every group has the same five resources, each designed around one of the theories of reading described by Thomas (2022, pp. 10–11). Groups work toward an interpretation of their whole sentence, then the class rebuilds the passage and discusses what each resource helped them do.</p></section>
        <section><h2>Setup</h2><ol>
          <li>Split the room into five groups: Oak, Moon, Fern, River and Star.</li>
          <li>One device per group opens this page and picks its group on the Group desk.</li>
          <li>Put the Class board on the shared screen.</li></ol>
          <p class="muted">Nothing is sent anywhere. Each device keeps its own progress.</p></section>
        <section><h2>Flow</h2>
          <div class="row"><b>First look</b><span>Groups see their sentence with no help and write what they notice.</span></div>
          <div class="row"><b>Five ways in</b><span>Groups open resources in any order, note optional clues, and tag what each resource helped them do. Their main task is an interpretation of the whole sentence, with a confidence rating.</span></div>
          <div class="row"><b>Share</b><span>Groups share their interpretation and resource reflections, then may check their sentence.</span></div>
          <div class="row"><b>Class board</b><span>Rebuild the passage, see which words crossed sentences, discuss, then connect to NC.</span></div>
          <p class="muted small">Timing depends on your slot. Roughly: first look 2 min, resources 10 min, rebuild 3 min, discussion 5–10 min.</p></section>
        <section><h2>How each resource reflects its theory</h2>
          <div class="row"><b style="color:var(--wl)">Whole Language</b><span>An illustrated scene and the sentence set inside a short story, so meaning comes from the whole text and context.</span></div>
          <div class="row"><b style="color:var(--bl)">Balanced Literacy</b><span>A teacher check-in: the group says what it has noticed and where it is stuck, and the teacher responds to that need with a mini-lesson, a word meaning, a structure hint, or a starting point.</span></div>
          <div class="row"><b style="color:var(--svr)">Simple View of Reading</b><span>Two panels that only work together: decoding (how each word sounds) and language comprehension (what words mean when heard).</span></div>
          <div class="row"><b style="color:var(--avr)">Active View of Reading</b><span>Background knowledge, the meanings of word parts, and self-monitoring prompts, reflecting its additions to the Simple View.</span></div>
          <div class="row"><b style="color:var(--sl)">Structured Literacy</b><span>Explicit, sequenced lessons on the Tengwar letters (with their Elvish names) and the vowel marks. It teaches how to say words, not what they mean.</span></div>
          <p class="cite">Theory descriptions follow Thomas (2022, pp. 10–11). Each resource is a simplified classroom analog, not a full version of the approach.</p></section>
        <section><h2>The passage (answer key)</h2>
          ${FRAGS.slice().sort((a, b) => a.order - b.order).map(f => `<div class="row"><b>${f.order}. ${f.group}</b><span><i>${esc(f.elv)}</i><br>${esc(f.en)}</span></div>`).join('')}</section>
        <section><h2>Framing</h2><p>Let groups discover the pattern. Avoid telling them in advance which resource does what. This is a hypothetical illustration, not evidence about which approach works best.</p></section>
        <section><h2>Sources on the board</h2><ul class="cite">
          <li>North Carolina General Assembly. (2021). <i>Excellent Public Schools Act of 2021</i>, S.L. 2021-8.</li>
          <li>Rowe, M. W., & Thrailkill, L. D. (2025). A view from within. <i>Education Policy Analysis Archives, 33</i>(82).</li>
          <li>Strack, P. (n.d.). <i>Eldamo: An Elvish lexicon</i>. https://eldamo.org (source for every Quenya word).</li>
          <li>Björkman, M. (n.d.). <i>Amanye Tenceli: The Classical mode</i>. (Tengwar spelling rules.)</li>
          <li>Omagari, T. (2022). <i>Alcarin Tengwar</i> [Typeface]. SIL Open Font License.</li>
          <li>Thomas, P. L. (2022). <i>The science of reading movement</i>. National Education Policy Center.</li></ul></section>
        <section><h2>Reset between sessions</h2><div class="actions"><button type="button" id="resetall">Clear all progress on this device</button><span class="muted small" id="resetmsg" aria-live="polite"></span></div></section>
      </div>`;
    document.getElementById('resetall').addEventListener('click', () => { S = { group: null, groups: {}, board: { order: [], show: false, step: 1 } }; save(); document.getElementById('resetmsg').textContent = 'Progress cleared on this device.'; });
  }

  render();
})();
</script>
</body>
</html>
